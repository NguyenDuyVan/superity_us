services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: superity-web:latest
    container_name: superity-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - deploy_web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=deploy_web"

      # HTTPS router
      - "traefik.http.routers.superity.rule=Host(`superity.us`) || Host(`www.superity.us`)"
      - "traefik.http.routers.superity.entrypoints=websecure"
      - "traefik.http.routers.superity.tls=true"
      - "traefik.http.routers.superity.tls.certresolver=letsencrypt"
      - "traefik.http.routers.superity.service=superity"

      # HTTP -> HTTPS redirect
      - "traefik.http.routers.superity-http.rule=Host(`superity.us`) || Host(`www.superity.us`)"
      - "traefik.http.routers.superity-http.entrypoints=web"
      - "traefik.http.routers.superity-http.middlewares=superity-redirect"
      - "traefik.http.middlewares.superity-redirect.redirectscheme.scheme=https"

      # Upstream service port
      - "traefik.http.services.superity.loadbalancer.server.port=3000"

networks:
  deploy_web:
    external: true
